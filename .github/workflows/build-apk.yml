name: Build and Sign Atelier Android Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-sign:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-36.1
            build-tools;36.0.0

      - name: Make gradlew executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "ERROR: gradlew is missing! Please add the Gradle Wrapper to the repository."
            exit 1
          fi

      - name: Inject Google Services Configuration (Firebase)
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json
            echo "google-services.json injected from BASE64 secret"
          elif [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
            echo "google-services.json injected from plain secret"
          elif [ ! -f "app/google-services.json" ]; then
            echo "Creating minimal placeholder app/google-services.json to prevent build failure"
            cat << 'EOF' > app/google-services.json
            {
              "project_info": {
                "project_number": "123456789",
                "project_id": "placeholder-project",
                "storage_bucket": "placeholder.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:123456789:android:abcdef",
                    "android_client_info": {
                      "package_name": "com.aistudio.atelier.vpxqzt"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [
                    {
                      "current_key": "fake_api_key"
                    }
                  ],
                  "services": {}
                }
              ],
              "configuration_version": "1"
            }
          EOF
          fi

      - name: Inject Keystore for Release Signing
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "Keystore injected successfully"
          else
            echo "WARNING: KEYSTORE_BASE64 secret not found. Will build Debug APK."
          fi

      - name: Inject Environment Secrets
        run: |
          cat << EOF > .env
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "my-upload-key.jks" ] && [ -n "${{ secrets.STORE_PASSWORD }}" ]; then
            echo "Building signed Release APK..."
            ./gradlew :app:assembleRelease --stacktrace
          else
            echo "Keystore or passwords missing → building Debug APK instead"
            ./gradlew :app:assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: atelier-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn
